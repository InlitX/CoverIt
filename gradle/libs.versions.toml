[versions]
agp = "9.2.1"
kotlin = "2.2.20"
coreKtx = "1.17.0"
activityCompose = "1.13.0"
composeBom = "2026.02.01"
pdfbox = "2.0.27.0"
haze = "1.7.3"
phosphor = "1.0.0"
zxing = "3.5.4"
exif = "1.4.2"
profileinstaller = "1.4.0"
tflite = "2.17.0"
tesseract = "4.8.0"
libphonenumber = "8.13.50"
junit = "4.13.2"
testRunner = "1.7.0"
testExtJunit = "1.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui-test = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
phosphor = { group = "com.adamglin", name = "phosphor-icon", version.ref = "phosphor" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exif" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
pdfbox-android = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfbox" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "testExtJunit" }

tflite = { group = "org.tensorflow", name = "tensorflow-lite", version.ref = "tflite" }
libphonenumber = { group = "com.googlecode.libphonenumber", name = "libphonenumber", version.ref = "libphonenumber" }
tesseract = { group = "com.github.adaptech-cz.Tesseract4Android", name = "tesseract4android", version.ref = "tesseract" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
